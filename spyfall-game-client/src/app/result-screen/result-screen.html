<div class="result-card">
  <h2>Runde beendet!</h2>

  <p class="location-label">Der Ort war</p>
  <p class="location" [class.hidden-text]="!showAnswer()" [class.animated]="transitionsReady()">
  {{ game.currentLocation() }}
</p>

  <p class="spy-label">
  🕵🏻‍♂️ Spion{{ spyPlayerNames().length > 1 ? 'e' : '' }}
  war{{ spyPlayerNames().length > 1 ? 'en' : '' }}:
    </p>
  <div class="spy-list">
    @for (name of spyPlayerNames(); track name) {
  <span class="spy-chip" [class.hidden-text]="!showAnswer()" [class.animated]="transitionsReady()">
    {{ name }}
  </span>
}
  </div>

    <button class="reveal-toggle" (click)="showAnswer.set(!showAnswer())">
    @if (showAnswer()) {
      <i class="fa-solid fa-eye-slash"></i> Verbergen
    } @else {
      <i class="fa-solid fa-eye"></i> Auflösung anzeigen
    }
  </button>
  <br>
  <button (click)="newRound()">Neue Runde starten</button>
</div>
